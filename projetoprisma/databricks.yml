# This is a Declarative Automation Bundle definition for projetoprisma.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: projetoprisma
  uuid: 322a7df9-95a3-4bfc-a6d0-cc67b49c1bd8

include:
  - resources/*.yml

# Só src/ precisa ir para o workspace; o resto é tooling local.
sync:
  exclude:
    - .claude
    - .vscode
    - tests
    - fixtures
    - llm
    - "*.md"
    - pyproject.toml
    - .gitignore
    - scripts

variables:
  catalog:
    description: Catálogo do lakehouse (bronze já carregada, silver pelo pipeline)
    default: projetoprisma
  warehouse_id:
    description: SQL warehouse das tarefas SQL (Serverless Starter Warehouse)
    default: e8b0590b58303bf3

targets:
  dev:
    # Sem mode: development (ele prefixa os nomes); só pausa os agendamentos.
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-aec91c23-6d1e.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-aec91c23-6d1e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/viniciusaf7@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/viniciusaf7@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: viniciusaf7@gmail.com
        level: CAN_MANAGE
